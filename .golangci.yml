# golangci-lint v2 configuration. Run: golangci-lint run ./...

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bidichk # CVE-2021-42574 Trojan Source defense
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errorlint
    - forbidigo
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - staticcheck
    - unconvert
    - usestdlibvars
  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment rarely affects performance meaningfully and
        # produces large noisy reorderings.
        - fieldalignment
        # shadow is legitimate often enough that the noise outweighs the
        # catches.
        - shadow
    staticcheck:
      checks:
        - all
        # QF is formatting style this repo has its own opinions on.
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        # ST1000 / ST1020 / ST1021 require godoc on every package, exported
        # func, and exported type.
        - -ST1000
        - -ST1020
        - -ST1021
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    misspell:
      locale: US
      ignore-rules:
        # `Cancelled` is a public constant and persisted string value;
        # renaming it would break the API and the schema.
        - cancelled
        - cancelling
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated since Go 1.16; use io and os."
            - pkg: github.com/pkg/errors
              desc: "use stdlib errors with %w wrapping; errors.Is/As replaces pkg/errors.Cause/As."
            - pkg: gopkg.in/yaml.v2
              desc: "use gopkg.in/yaml.v3; v2 is unmaintained and has known issues with anchor handling."
            - pkg: github.com/stretchr/testify/assert
              desc: "use testify/require instead so a failed assertion stops the test (assert keeps going and produces follow-on noise)."
    forbidigo:
      # analyze-types=false keeps the rule on textual matches, with no need to
      # load full type info.
      exclude-godoc-examples: true
      analyze-types: false
      forbid:
        - pattern: ^panic$
          msg: "panic() in library code is a hard crash; return an error and let the caller decide. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^os\.Exit$
          msg: "os.Exit short-circuits deferred cleanup; return an error from main or use orchestrator-managed shutdown. Allowed in cmd/**/main.go (see exclusions)."
        - pattern: ^fmt\.Println$
          msg: "fmt.Println bypasses the structured logger; use sparkwing.Info/Error or slog directly. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^time\.Sleep$
          msg: "time.Sleep ignores context cancellation; use select { case <-time.After(d): case <-ctx.Done(): return ctx.Err() } so the wait is cancelable. Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^http\.NewRequest$
          msg: "http.NewRequest detaches the request from context; use http.NewRequestWithContext(ctx, ...) so cancellation and deadlines propagate to the transport."
        - pattern: ^http\.(Get|Post|Head|PostForm)$
          msg: "http.Get/Post/Head/PostForm use http.DefaultClient (no timeout) and carry no context; build an *http.Client with a Timeout and call client.Do(http.NewRequestWithContext(ctx, ...))."
        - pattern: ^http\.DefaultClient$
          msg: "http.DefaultClient has no timeout and will hang forever on a stalled peer; construct an *http.Client{Timeout: ...} instead."
        - pattern: ^context\.(Background|TODO)$
          msg: "library code receives a context from its caller -- thread it instead of starting a fresh root. For deliberately-detached work use context.WithoutCancel(ctx). Allowed in cmd/**/main.go and _test.go (see exclusions)."
        - pattern: ^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "log.Fatal/Panic short-circuit deferred cleanup and crash the process; return an error and let the caller decide. Allowed in cmd/**/main.go (see exclusions)."
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: _test\.go
        linters:
          - forbidigo
      # The forbidigo bans target library code; a CLI entry point
      # legitimately panics, exits, and prints at the process boundary.
      - path: cmd/
        linters:
          - forbidigo
      # Panic is planguard's contract, not a leak.
      - path: sparkwing/planguard/
        linters:
          - forbidigo
      - path: \.pb\.go$
        linters:
          - all
      - source: "^// Code generated"
        linters:
          - all

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/sparkwing-dev
