# The rules below are off because they fire on this repo's prose style
# without catching real issues.

config:
  # Line length: code blocks, tables, and link-heavy lines exceed it.
  MD013: false
  # Inline HTML: <kbd>, <details>.
  MD033: false
  # Bare URLs: cited directly in README and CHANGELOG.
  MD034: false
  # First line must be h1: some docs open with ## sections.
  MD041: false
  # Heading style: both ATX and setext are allowed.
  MD003: false
  MD012:
    maximum: 2
  # Table column style: renderers handle both forms identically.
  MD060: false
  # Code-block language tag: ASCII art and plain output are legitimately
  # untagged.
  MD040: false

globs:
  - "docs/**/*.md"
  - "*.md"
ignores:
  - "node_modules/**"
  - "web/**"
  # CHANGELOG.md has a dedicated checker enforcing conventions
  # markdownlint cannot see.
  - "**/CHANGELOG.md"
